services:
  edge-connector:
    build: .
    container_name: hospital-edge-connector
    restart: unless-stopped
    network_mode: "host"
    pid: "host"
    privileged: true
    volumes:
      - /var/ossec:/var/ossec
      - ./logs:/app/logs
      - /run/dbus:/run/dbus
      - /run/systemd:/run/systemd
    env_file:
      - .env
