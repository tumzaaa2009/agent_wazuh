services:
  edge-connector:
    build: .
    container_name: hospital-edge-connector
    restart: unless-stopped
    network_mode: "host"
    pid: "host"
    privileged: true
    volumes:
      - /var/ossec:/var/ossec
      - ./logs:/app/logs
      - ./index.ts:/app/index.ts
      - ./agent_version.txt:/app/agent_version.txt
      - ./version_custom_soc.txt:/app/version_custom_soc.txt
      - ./soc_rules_version.txt:/app/soc_rules_version.txt
      - ./version_misp_ioc.txt:/app/version_misp_ioc.txt
      - ./custom-soc:/app/custom-soc
      - /run/dbus:/run/dbus
      - /run/systemd:/run/systemd
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /dev/log:/dev/log
    env_file:
      - .env
