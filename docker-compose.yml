services:
  edge-connector:
    build: .
    container_name: hospital-edge-connector
    command: ["bun", "--watch", "run", "index.ts"]
    restart: unless-stopped
    network_mode: "host"
    pid: "host"
    privileged: true
    volumes:
      - /var/ossec:/var/ossec
      - ./:/app
      - /app/node_modules
      - /run/dbus:/run/dbus
      - /run/systemd:/run/systemd
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /dev/log:/dev/log
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  edge-updater:
    build: .
    container_name: hospital-edge-updater
    command: ["bun", "run", "boot.ts"]
    restart: unless-stopped
    volumes:
      - ./:/app
      - /app/node_modules
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
