services:
  yara:
    image: cincan/yara:latest
    container_name: yara
    restart: unless-stopped
    volumes:
      - /etc:/scan/etc:ro
      - /opt:/scan/opt:ro
      - /var:/scan/var:ro
      - /usr/local/bin:/scan/usr-local-bin:ro
      - /usr/bin:/scan/usr-bin:ro
      - /usr/sbin:/scan/usr-sbin:ro
      - /home:/scan/home:ro
      - /root:/scan/root:ro
      - /tmp:/scan/tmp:ro
      - /var/tmp:/scan/var-tmp:ro

      # === YARA Rules (ซิงก์จาก Edge Connector -> Shared -> Docker) ===
      - /var/ossec/etc/shared/default/yara_rules.yar:/opt/yara/rules/yara_rules.yar:ro

      # === Log output ===
      - /var/yara/logs:/logs
    entrypoint: ["sleep", "infinity"]
    # Container จะ sleep ค้างไว้ เพื่อให้ Active Response Script
    # เรียก `docker exec yara yara ...` หรือ `docker run --rm` ได้ตลอด