    <!-- Ignore system noise -->
    <ignore>C:\Windows\Temp</ignore>
    <ignore>C:\Windows\Prefetch</ignore>
    <ignore>C:\Windows\SoftwareDistribution</ignore>
    <ignore>C:\$Recycle.Bin</ignore>
    <ignore type="sregex">.log$|.tmp$|.etl$</ignore>

    <skip_nfs>yes</skip_nfs>
    <max_eps>50</max_eps>

    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- Active Response: YARA scan เมื่อ FIM ตรวจเจอไฟล์ใหม่/เปลี่ยนแปลง -->
  <!-- ใช้ yara64.exe ที่ User ติดตั้งเองบนเครื่อง Windows -->
  <localfile>
    <log_format>syslog</log_format>
    <location>C:\Program Files (x86)\ossec-agent\active-response\active-responses.log</location>
  </localfile>

</agent_config>

<!-- ==================== LINUX/UBUNTU AGENTS ==================== -->
<agent_config os="Linux">

  <!-- FIM: เฝ้าระวัง Directory หลักแบบ Realtime -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- System critical paths -->
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin,/bin,/sbin,/boot</directories>

    <!-- Application & Data paths (Realtime) -->
    <directories check_all="yes" realtime="yes" restrict="\.exe$|\.dll$|\.sh$|\.php$|\.py$|\.pl$|\.rb$|\.js$|\.elf$|\.bin$|\.so$|\.war$|\.jar$">/opt</directories>
    <directories check_all="yes" realtime="yes" restrict="\.exe$|\.dll$|\.sh$|\.php$|\.py$|\.pl$|\.rb$|\.js$|\.elf$|\.bin$|\.so$|\.war$|\.jar$">/var/www</directories>
    <directories check_all="yes" realtime="yes" restrict="\.exe$|\.dll$|\.sh$|\.php$|\.py$|\.pl$|\.rb$|\.js$|\.elf$|\.bin$|\.so$|\.war$|\.jar$">/var/opt</directories>
    <directories check_all="yes" realtime="yes" restrict="\.exe$|\.dll$|\.sh$|\.php$|\.py$|\.pl$|\.rb$|\.js$|\.elf$|\.bin$|\.so$|\.war$|\.jar$">/tmp</directories>
    <directories check_all="yes" realtime="yes" restrict="\.exe$|\.dll$|\.sh$|\.php$|\.py$|\.pl$|\.rb$|\.js$|\.elf$|\.bin$|\.so$|\.war$|\.jar$">/home</directories>
    <directories check_all="yes" realtime="yes" restrict="\.exe$|\.dll$|\.sh$|\.php$|\.py$|\.pl$|\.rb$|\.js$|\.elf$|\.bin$|\.so$|\.war$|\.jar$">/root</directories>
    <directories check_all="yes" realtime="yes" restrict="\.exe$|\.dll$|\.sh$|\.php$|\.py$|\.pl$|\.rb$|\.js$|\.elf$|\.bin$|\.so$|\.war$|\.jar$">/srv</directories>

    <!-- Ignore system noise -->
    <ignore>/var/log</ignore>
    <ignore>/var/run</ignore>
    <ignore>/var/cache</ignore>
    <ignore>/var/tmp</ignore>
    <ignore>/var/lib/docker/overlay2</ignore>
    <ignore>/var/lib/containerd</ignore>
    <ignore>/var/ossec/queue</ignore>
    <ignore>/var/ossec/logs</ignore>
    <ignore>/var/ossec/var</ignore>
    <ignore>/var/ossec/tmp</ignore>
    <ignore type="sregex">.log$|.swp$|.pid$|.sock$</ignore>

    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <max_eps>50</max_eps>

    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- Active Response Log (สำหรับรับผลจาก YARA scan) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

</agent_config>
