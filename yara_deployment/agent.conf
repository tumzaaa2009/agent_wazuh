<!-- ============================================================
     SOC Zone - Shared Agent Configuration (agent.conf)
     วางไว้ที่ Manager: /var/ossec/etc/shared/default/agent.conf
     Wazuh จะซิงก์ไฟล์นี้ลง Agent ทุกตัวอัตโนมัติ
     ============================================================ -->

<!-- ==================== WINDOWS AGENTS ==================== -->
<agent_config os="windows">

  <!-- FIM: เฝ้าระวังไดรฟ์ A: ถึง Z: แบบ Realtime -->
  <!-- กรองเฉพาะไฟล์ที่มีความเสี่ยง (executable, script, office macro) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- System Drives -->
    <directories check_all="yes" realtime="yes" restrict="\.exe$|\.dll$|\.bat$|\.ps1$|\.vbs$|\.php$|\.js$|\.sh$|\.com$|\.msi$|\.scr$|\.hta$|\.wsf$|\.lnk$|\.docm$|\.xlsm$|\.pptm$">C:</directories>
